name: Import site package
# One-time import: unpacks the VerifyU site package into this repository, then removes itself.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the package
        run: curl -fsSL -o /tmp/site.zip "https://raw.githubusercontent.com/adityaps70/verifyu/c987985f77c599e4ff8c6a65f2236a262349a06d/verifyu-github-repo_2.zip"
      - name: Verify the package checksum
        run: echo "cd991866ddff616ab14df3d4f69961552cf1d16663539a1e5a87f82d986adcfb  /tmp/site.zip" | sha256sum -c -
      - name: Unpack into the repository
        run: |
          unzip -oq /tmp/site.zip -d "$GITHUB_WORKSPACE"
          grep -qx 'dist/' .gitignore || printf '# built copy for self-hosting (regenerated by `node build.mjs`; GitHub Pages uses docs/)\ndist/\n' >> .gitignore
          rm -f .github/workflows/import.yml
          rmdir .github/workflows .github 2>/dev/null || true
      - name: Commit and push
        run: |
          git config user.name "adityaps70"
          git config user.email "167612148+adityaps70@users.noreply.github.com"
          git add -A
          git commit -m "VerifyU website

          Static site source, content admin, and the GitHub Pages build in docs/.

          Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01Ep1NN3p5e8fPZFoPAuMqzM"
          git push
