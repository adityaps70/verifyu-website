name: Apply site update
# One-time: applies .github/update.patch as its own commit, then removes the patch and this workflow.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-update.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the patch checksum
        run: echo "909874ec49dc5831d54e7dcda70f67a2a9cf15afd0a8e93d60a6251377d9090f  .github/update.patch" | sha256sum -c -
      - name: Apply the update and remove the helper files
        run: |
          git config user.name "adityaps70"
          git config user.email "167612148+adityaps70@users.noreply.github.com"
          cp .github/update.patch /tmp/update.patch
          git am /tmp/update.patch
          git rm -q .github/update.patch .github/workflows/apply-update.yml
          git commit -q -m "Remove one-time update helper"
          git push
